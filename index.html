<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WeightTrack</title>
  <meta name="description" content="Track your weight, a target weight, weekly targets and BMI, with graphs of your progress.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WeightTrack">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved light/dark choice before the page paints (avoids a flash).
    try {
      var s = JSON.parse(localStorage.getItem('weighttrack.v1') || '{}').settings || {};
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-text">
        <div id="backSlot"></div>
        <p class="eyebrow" id="eyebrow" hidden></p>
        <h1 id="title">Today</h1>
      </div>
      <div id="headerAction"></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Main">
    <a href="#today" data-tab="today">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      <span>Today</span>
    </a>
    <a href="#history" data-tab="history">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
      <span>History</span>
    </a>
    <a href="#progress" data-tab="progress">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18"/><path d="m4 15 5-5 4 3 7-7"/><path d="M15 6h5v5"/></svg>
      <span>Progress</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:16px">WeightTrack needs JavaScript turned on.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
